[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvs-benchmark"
version = "0.1.0"
description = "Educational benchmark for dynamic NVS methods"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TCC NVS Benchmark" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-image>=0.22",
  "viser>=0.1.32",
  "lpips>=0.1.4",
  "torch>=2.2",
  "torchvision>=0.17",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "jinja2>=3.1",
  "weasyprint>=62.3",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.scripts]
nvs-benchmark = "nvs_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
