name: Build & Publicar no PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publicar no PyPI (true/false)"
        required: false
        default: "false"
        type: string

jobs:
  build:
    name: Compilar wheel e sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar build
        run: pip install build twine

      - name: Construir pacote
        run: python -m build

      - name: Verificar pacote com twine
        run: twine check dist/*

      - name: Fazer upload dos artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publicar no PyPI
    runs-on: ubuntu-latest
    needs: build
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/nvs-benchmark
    permissions:
      id-token: write  # OIDC para PyPI trusted publishing
    steps:
      - name: Baixar artefatos de build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
