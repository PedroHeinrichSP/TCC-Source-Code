name: CI — Testes, Lint e Type Check

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Qualidade de Código (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências de desenvolvimento
        run: pip install -e ".[dev]"

      - name: Lint com ruff
        run: ruff check src/ tests/

      - name: Verificar formatação (ruff format)
        run: ruff format --check src/ tests/

      - name: Type check com mypy
        run: mypy src/nvs_benchmark/
        continue-on-error: true  # Não bloqueia PR por erros de tipo ainda

  tests:
    name: Testes (pytest + cobertura)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -e ".[dev]"
          # Instalar torch CPU-only para testes (mais rápido em CI)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Rodar testes com cobertura
        run: |
          pytest tests/ \
            --cov=nvs_benchmark \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -k "not real and not gpu and not adapters_real"

      - name: Fazer upload da cobertura para Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
